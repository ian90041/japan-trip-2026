<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#29483f"><title>日本家庭旅行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#243b36;font:17px/1.65 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px 48px}header{background:#29483f;color:white;padding:30px 24px;border-radius:24px}h1{font-size:32px;margin:8px 0}h2{font-size:24px;margin:24px 0 12px}small{font-size:13px;letter-spacing:2px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}button{font:inherit;border:1px solid #d4dcd4;border-radius:12px;background:white;color:#29483f;padding:10px 4px;cursor:pointer}button[aria-pressed=true]{background:#29483f;color:white}article{background:white;border-radius:16px;padding:18px;margin:12px 0;border:1px solid #e4e1da}article p{margin:6px 0 10px;font-size:16px;line-height:1.55}.transfer{background:transparent;border:0;padding:4px 12px;margin:4px 0;color:#59635e}.transfer h3{font-size:16px;font-weight:400}.summary{padding:12px;background:#e8eee5;border-radius:12px;font-size:15px}article h3{margin:4px 0;font-size:24px;line-height:1.4}a{color:#285c48;font-weight:600;font-size:14px}footer{color:#59635e;font-size:13px;margin-top:30px}.time{color:#6b7165;font-size:18px;line-height:1.4}.dayno{display:block;font-size:11px}#status{font-size:14px}
 
:root{color-scheme:light;--ink:#243b36;--accent:#29483f;--paper:#f7f5ef}
body{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%}
main{padding-top:16px}
header{position:relative;isolation:isolate;overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 24px;border-radius:22px;background:#29483f;box-shadow:0 8px 24px #243b3612}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
header small{font-weight:600;letter-spacing:2.5px;color:#f2e4ce}
header h1{margin:5px 0 4px;text-shadow:0 1px 8px #162c2c55}
header div{color:#f1eee6}
nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:20px 0 24px}
nav button{min-width:0;border-color:#e2e5dd;background:#fffdfa;border-radius:12px;padding:9px 3px;line-height:1.35;font-variant-numeric:tabular-nums}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);box-shadow:0 3px 8px #29483f24}
.dayno{margin-top:3px;letter-spacing:.5px;opacity:.8}
h2{border-bottom:1px solid #d9ded5;padding-bottom:12px;line-height:1.4}
.summary{background:#edf0e8;border-left:3px solid #829889;padding:12px 15px}
article{border:1px solid #e6e4dc;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #243b3606}
article h3{margin:7px 0 8px}
article p{margin:5px 0 12px}
.time{font-variant-numeric:tabular-nums;color:#607268}
.transfer{box-shadow:none;border:0;border-left:2px solid #cbd5ca;border-radius:0;margin:6px 0 6px 18px;padding:5px 14px}
.transfer h3{margin:3px 0;color:#59635e}
article a{display:inline-block;text-decoration:none;border-bottom:1px solid #9eb3a5;padding:3px 0}
footer{border-top:1px solid #dedfd6;padding-top:16px}
button:focus-visible,a:focus-visible{outline:2px solid #b07b45;outline-offset:3px}
</style></head><body><main><header><svg class="hero-art" viewBox="0 0 700 330" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#233e49"/><stop offset="1" stop-color="#aab7ac"/></linearGradient><linearGradient id="mount" x2="0" y2="1"><stop stop-color="#759297"/><stop offset="1" stop-color="#365660"/></linearGradient><linearGradient id="shade" x2="1" y2="0"><stop stop-color="#142e2f" stop-opacity=".92"/><stop offset=".68" stop-color="#142e2f" stop-opacity=".30"/><stop offset="1" stop-color="#142e2f" stop-opacity=".04"/></linearGradient></defs><rect width="700" height="330" fill="url(#sky)"/><circle cx="570" cy="73" r="38" fill="#e8c9a0" opacity=".87"/><path d="M0 240 Q75 195 132 225 T250 205 L340 250 L700 250 V330 H0Z" fill="#647d7e"/><path d="M145 254 Q248 225 323 133 L390 48 Q396 41 404 49 L470 137 Q536 217 665 254Z" fill="url(#mount)"/><path d="M323 133 L390 48 Q396 41 404 49 L470 137 L444 124 L430 132 L414 108 L402 124 L387 98 L370 120 L356 111Z" fill="#e6e9e2"/><path d="M0 252 Q160 245 350 255 T700 249 V330 H0Z" fill="#385c61"/><path d="M0 273 Q170 262 340 278 T700 269 M80 299 Q220 286 360 299 T650 289" fill="none" stroke="#b6c3b8" stroke-opacity=".28" stroke-width="2"/><path d="M0 315 Q170 292 300 321 L700 330 H0Z" fill="#223d3c"/><rect width="700" height="330" fill="url(#shade)"/></svg><small>JAPAN FAMILY TRIP</small><h1>日本家庭旅行</h1><div>2026.11.27 — 12.04 · 8 天 7 夜</div></header><nav id="dates" aria-label="日期"></nav><section id="day" aria-live="polite"></section><footer>家庭旅遊手冊 · 行程可能隨時調整<br><span id="status">載入行程中…</span></footer></main>
<script>
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
const maps={'澀谷 SKY':'SHIBUYA SKY','新宿御苑賞楓':'Shinjuku Gyoen','明治神宮外苑賞銀杏':'明治神宮外苑 いちょう並木'};
fetch('./itinerary.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const nav=document.querySelector('#dates'),day=document.querySelector('#day');function show(i){[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const d=data.days[i];day.replaceChildren(el('h2',d.date+'｜'+d.title));if(d.summary)day.append(el('p',d.summary,'summary'));if(!d.items.length)day.append(el('article','完整行程尚未匯入。'));d.items.forEach(item=>{const a=el('article');a.append(el('div',item[0],'time'),el('h3',item[1]));if(/^(車程|電輔車|沿湖自駕|步行前往)/.test(item[1]))a.className='transfer';if(item[2])a.append(el('p',item[2]));const map=item[3]||maps[item[1]];if(map){const link=el('a','開啟 Google Maps ↗');link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(map);link.target='_blank';link.rel='noopener';a.append(link)}day.append(a)})}data.days.forEach((d,i)=>{const b=el('button',d.date);b.append(el('span','DAY '+(i+1),'dayno'));b.onclick=()=>show(i);nav.append(b)});const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));const today=p.year+'-'+p.month+'-'+p.day;const i=data.days.findIndex(d=>'2026-'+d.date.replace('/','-')===today);show(today<'2026-11-27'?0:today>'2026-12-04'?data.days.length-1:Math.max(0,i));document.querySelector('#status').textContent='已載入行程資料 · v13'}).catch(()=>{document.querySelector('#day').textContent='行程載入失敗，請重新整理網頁。';document.querySelector('#status').textContent='載入失敗'});
</script></body></html>
