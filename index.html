<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#29483f"><title>日本家庭旅行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#243b36;font:20.4px/1.65 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px 48px}header{background:#29483f;color:white;padding:30px 24px;border-radius:24px}h1{font-size:38.4px;margin:8px 0}h2{font-size:28.8px;margin:24px 0 12px}small{font-size:15.6px;letter-spacing:2px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}button{font:inherit;border:1px solid #d4dcd4;border-radius:12px;background:white;color:#29483f;padding:10px 4px;cursor:pointer}button[aria-pressed=true]{background:#29483f;color:white}article{background:white;border-radius:16px;padding:18px;margin:12px 0;border:1px solid #e4e1da}article p{margin:6px 0 10px;font-size:18px}.transfer{background:transparent;border:0;padding:4px 12px;margin:4px 0;color:#59635e}.transfer h3{font-size:16.8px;font-weight:400}.summary{padding:12px;background:#e8eee5;border-radius:12px;font-size:18px}article h3{margin:4px 0;font-size:24px}a{color:#285c48;font-weight:600;font-size:16.8px}footer{color:#59635e;font-size:15.6px;margin-top:30px}.time{color:#6b7165;font-size:16.8px}.dayno{display:block;font-size:13.2px}#status{font-size:16.8px}

nav button{min-width:0;overflow-wrap:anywhere}</style></head><body><main><header><small>JAPAN FAMILY TRIP</small><h1>日本家庭旅行</h1><div>2026.11.27 — 12.04 · 8 天 7 夜</div></header><nav id="dates" aria-label="日期"></nav><section id="day" aria-live="polite"></section><footer>家庭旅遊手冊 · 行程可能隨時調整<br><span id="status">載入行程中…</span></footer></main>
<script>
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e};
const maps={'澀谷 SKY':'SHIBUYA SKY','新宿御苑賞楓':'Shinjuku Gyoen','明治神宮外苑賞銀杏':'明治神宮外苑 いちょう並木'};
fetch('./itinerary.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const nav=document.querySelector('#dates'),day=document.querySelector('#day');function show(i){[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const d=data.days[i];day.replaceChildren(el('h2',d.date+'｜'+d.title));if(d.summary)day.append(el('p',d.summary,'summary'));if(!d.items.length)day.append(el('article','完整行程尚未匯入。'));d.items.forEach(item=>{const a=el('article');a.append(el('div',item[0],'time'),el('h3',item[1]));if(/^(車程|電輔車|沿湖自駕|步行前往)/.test(item[1]))a.className='transfer';if(item[2])a.append(el('p',item[2]));const map=item[3]||maps[item[1]];if(map){const link=el('a','開啟 Google Maps ↗');link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(map);link.target='_blank';link.rel='noopener';a.append(link)}day.append(a)})}data.days.forEach((d,i)=>{const b=el('button',d.date);b.append(el('span','DAY '+(i+1),'dayno'));b.onclick=()=>show(i);nav.append(b)});const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));const today=p.year+'-'+p.month+'-'+p.day;const i=data.days.findIndex(d=>'2026-'+d.date.replace('/','-')===today);show(today<'2026-11-27'?0:today>'2026-12-04'?data.days.length-1:Math.max(0,i));document.querySelector('#status').textContent='已載入行程資料 · v4'}).catch(()=>{document.querySelector('#day').textContent='行程載入失敗，請重新整理網頁。';document.querySelector('#status').textContent='載入失敗'});
</script></body></html>
